name: greeting
provider: anthropic
model: claude-sonnet-4-5-20250929
max_tokens: 1024
temperature: 0.5

meta:
  description: "Greeting prompt for testing"
  variables:
    runtime:
      - name: "userName"
        type: "string"

system_prompt: |
  You are a friendly greeting assistant.
  Always respond in JSON format with "message" and "tone" fields.

prompt: |
  Say hello to {{ $userName }}.
  Return JSON: {"message": "...", "tone": "..."}
